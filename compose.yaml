services:
  postgres:
    image: postgres:17
    container_name: postgres-fitval
    environment:
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: alumno_dev_123
      POSTGRES_DB: fitval
    ports:
      - "5434:5432" # el 5433 lo usa el PostgreSQL de Windows
    volumes:
      - fitval-data:/var/lib/postgresql/data

volumes:
  fitval-data:
